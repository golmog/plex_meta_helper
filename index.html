<!-- index.html (모바일 PWA & 태블릿 듀얼뷰 앱) -->
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PMH Mobile</title>
    <meta name="theme-color" content="#1e2124">
    
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="PMH">
    
    <link rel="apple-touch-icon" sizes="180x180" href="/api/client/apple-touch-icon.png">
    <link rel="icon" type="image/png" href="/api/client/favicon-96x96.png" sizes="96x96">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --bg: #121212; --panel: #1e2124; --text: #e0e0e0; --primary: #e5a00d; --border: #333; --success: #51a351; --danger: #bd362f; }
        
        html { background-color: #000; }
        body { 
            max-width: 1200px; 
            margin: 0 auto; 
            background: var(--bg); 
            color: var(--text); 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            -webkit-tap-highlight-color: transparent; 
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
            overflow-x: hidden;
        }
        * { box-sizing: border-box; }
        
        .tab-bar { max-width: 1200px; margin: 0 auto; right: 0; position: fixed; bottom: 0; left: 0; width: 100%; background: var(--panel); border-top: 1px solid var(--border); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 100; }
        #toast { max-width: 90%; width: max-content; position: fixed; top: 20px; left: 50%; transform: translateX(-50%); background: var(--success); color: #fff; padding: 12px 24px; border-radius: 30px; font-size: 14px; font-weight: bold; opacity: 0; pointer-events: none; transition: 0.3s; z-index: 9999; box-shadow: 0 5px 15px rgba(0,0,0,0.5); white-space: nowrap; }
        #pwa-install-banner { max-width: 1200px; margin: 0 auto; right: 0; }

        .navbar { background: var(--panel); border-bottom: 1px solid var(--border); padding: 15px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px); }
        .nav-title { color: var(--primary); font-weight: 800; font-size: 18px; display: flex; align-items: center; gap: 8px; }
        
        .screen { display: none; padding-bottom: 70px; animation: fadeIn 0.2s ease; }
        .screen.active { display: block; }
        #screen-portal, #screen-setup { padding: 15px; padding-bottom: 70px; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        
        .form-group { margin-bottom: 20px; }
        .form-label { display: block; color: var(--primary); font-size: 13px; font-weight: bold; margin-bottom: 8px; }
        .input-text, .input-select { width: 100%; padding: 14px; background: #0a0a0c; color: #fff; border: 1px solid var(--border); border-radius: 8px; font-size: 14px; outline: none; transition: 0.2s; }
        .input-text:focus, .input-select:focus { border-color: var(--primary); }
        .btn { width: 100%; padding: 16px; background: var(--primary); color: #111; border: none; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; display: flex; justify-content: center; align-items: center; gap: 8px; transition: 0.2s; }
        .btn:active { transform: scale(0.97); }
        .btn:disabled { background: #444; color: #888; cursor: not-allowed; }
        .btn-success { background: var(--success); color: #fff; }
        
        .dashboard-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .dash-card { background: rgba(255,255,255,0.03); border: 1px solid var(--border); border-radius: 10px; padding: 15px; text-align: center; }
        .dash-card.active-run { border-color: var(--primary); background: rgba(229,160,13,0.1); }
        .dash-card.active-cron { border-color: var(--success); background: rgba(81,163,81,0.1); }
        
        .tool-card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 15px; margin-bottom: 12px; display: flex; align-items: center; gap: 15px; cursor: pointer; transition: 0.2s; }
        .tool-card:active { background: rgba(255,255,255,0.05); }
        .tool-card.running { border-left: 4px solid var(--primary); background: rgba(229,160,13,0.05); }
        .tool-icon { font-size: 26px; color: var(--primary); width: 30px; text-align: center; }
        .tool-info { flex: 1; min-width: 0; }
        .tool-title { font-size: 16px; font-weight: bold; color: #fff; margin-bottom: 4px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: flex; align-items: baseline; gap: 6px; }
        .tool-desc { font-size: 12px; color: #aaa; }
        .badge { display: inline-block; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: bold; }
        .badge-run { background: rgba(229,160,13,0.2); color: var(--primary); border: 1px solid var(--primary); }
        .badge-cron { background: rgba(81,163,81,0.2); color: var(--success); border: 1px solid var(--success); }

        .badge-stale { color:#aaa; background:#333; border:1px solid #666; }
        .badge-node { color:#aaa; }
        #portal-node-status { display:flex; flex-wrap:wrap; gap:6px; margin-bottom:15px; }
        .portal-badges { display:flex; flex-wrap:wrap; gap:5px; margin-top:6px; }
        button.badge { cursor:pointer; font-family:inherit; }
        .portal-tool-version { font-size:11px; color:#777; font-weight:normal; }
        .portal-running { font-size:12px; color:var(--primary); }
        .tool-title, .tool-desc { white-space:normal; line-height:1.4; flex-wrap:wrap; }
        .portal-empty { text-align:center; color:#777; padding:20px; }

        .tab-item { flex: 1; padding: 12px 0; text-align: center; color: #666; font-size: 11px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .tab-item.active { color: var(--primary); }
        .tab-item.disabled { color: #333; cursor: not-allowed; opacity: 0.5; pointer-events: none; }
        .tab-item i { display: block; font-size: 20px; margin-bottom: 4px; }

        .pmh-tab-btn { white-space: nowrap !important; flex-shrink: 0 !important; }

        /* ========================================================
           태블릿 / PC 가로 화면 대응: 다이나믹 듀얼 뷰 레이아웃
           ======================================================== */
        @media (min-width: 769px) {
            #tool-form-container > div {
                display: grid !important;
                grid-template-columns: 50% 50%;
                grid-template-rows: auto 1fr;
                gap: 0;
                height: calc(100vh - 70px); 
            }

            #tool-form-container > div > div:nth-child(1) {
                grid-column: 1 / 3;
                grid-row: 1 / 2;
                position: relative;
                margin-bottom: 0 !important;
            }

            #tool-form-container > div > div:nth-child(1) > div {
                width: 50% !important;
                overflow: visible !important;
            }

            [data-tab="pmh_tab_monitor"] {
                position: absolute !important;
                left: 50% !important;
                bottom: 0 !important;
                margin-left: 15px !important;
                border-bottom: 2px solid transparent !important;
                color: #e5a00d !important;
                font-weight: bold !important;
                pointer-events: none !important; 
            }

            #pmh_tab_form, #pmh_tab_settings {
                grid-column: 1 / 2;
                grid-row: 2 / 3;
                border-right: 1px solid #333;
                padding-right: 15px;
                margin-top: 15px;
                min-height: 0;
                overflow-y: auto; 
            }

            #pmh_tab_monitor {
                display: flex !important;
                grid-column: 2 / 3;
                grid-row: 2 / 3;
                padding-left: 15px;
                margin-top: 15px;
                min-height: 0; 
            }
        }

    </style>
</head>
<body>

    <div id="pwa-install-banner" style="display:none; background:var(--primary); color:#111; padding:12px 15px; font-size:13px; font-weight:bold; align-items:center; justify-content:space-between; box-shadow: 0 4px 10px rgba(0,0,0,0.5); z-index:9999; position:relative;">
        <div style="display:flex; align-items:center; gap:10px;">
            <i class="fas fa-download" style="font-size:20px;"></i>
            <span style="line-height:1.4;">홈 화면에 앱으로 추가하여<br>전체 화면으로 쾌적하게 사용하세요!</span>
        </div>
        <button id="btn-pwa-install" style="background:#111; color:var(--primary); border:none; padding:8px 12px; border-radius:6px; font-weight:bold; cursor:pointer;">설치</button>
    </div>

    <div id="screen-portal" class="screen active">
        <div id="portal-loading" style="text-align:center; padding:50px 0; color:#777; display:none;">
            <i class="fas fa-spinner fa-spin" style="font-size:30px; color:var(--primary); margin-bottom:15px;"></i><br>서버에서 정보를 불러오고 있습니다...
        </div>
        
        <div id="portal-content" style="display:none;">
            <div class="dashboard-grid">
                <div class="dash-card" id="dash-run">
                    <div style="font-size:11px; color:#aaa; margin-bottom:4px;"><i class="fas fa-running" style="color:var(--primary);"></i> 실행 중인 작업</div>
                    <div style="font-size:20px; font-weight:bold; color:#777;" id="dash-run-cnt">0건</div>
                </div>
                <div class="dash-card" id="dash-cron">
                    <div style="font-size:11px; color:#aaa; margin-bottom:4px;"><i class="fas fa-clock" style="color:var(--success);"></i> 스케줄링(크론)</div>
                    <div style="font-size:20px; font-weight:bold; color:#777;" id="dash-cron-cnt">0건</div>
                </div>
            </div>

            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
                <h3 style="margin:0; font-size:15px; color:#ddd;"><i class="fas fa-toolbox"></i> 내 툴박스</h3>
                <button id="btn-portal-refresh" onclick="loadPortal()" style="background:none; border:none; color:var(--primary); font-size:16px; padding:5px;"><i class="fas fa-sync-alt"></i></button>
            </div>
            
            <div id="portal-node-status" aria-live="polite"></div>
            <div id="tool-list"></div>
        </div>

        <div id="portal-error" style="text-align:center; padding:50px 0; color:var(--danger); display:none;">
            <i class="fas fa-exclamation-triangle" style="font-size:30px; margin-bottom:15px;"></i><br>
            <span id="portal-error-msg">설정 탭에서 서버를 연결해주세요.</span>
        </div>
    </div>

    <div id="screen-setup" class="screen">
        <h2 style="margin-top:0; color:var(--primary); font-size:18px; border-bottom:1px solid var(--border); padding-bottom:15px;">
            <i class="fas fa-cogs"></i> 서버 연결 설정
        </h2>
        
        <div class="form-group">
            <label class="form-label"><i class="fas fa-network-wired"></i> 마스터 서버 URL</label>
            <input type="url" id="inp-url" class="input-text" placeholder="http://192.168.x.x:8899">
        </div>
        <div class="form-group">
            <label class="form-label"><i class="fas fa-key"></i> 마스터 API Key</label>
            <div style="display:flex; gap:10px;">
                <input type="password" id="inp-key" class="input-text" placeholder="BASE.APIKEY 입력" style="flex:1;">
                <button id="btn-copy-key" class="btn" style="width:50px; background:#333; color:#fff; padding:14px;"><i class="fas fa-copy"></i></button>
            </div>
        </div>
        
        <div style="display:flex; gap:10px; margin-top:30px;">
            <button id="btn-test" class="btn" style="background:#2f96b4; color:#fff; flex:1;"><i class="fas fa-plug"></i> 테스트</button>
            <button id="btn-save" class="btn btn-success" style="flex:2;"><i class="fas fa-save"></i> 저장 및 연결</button>
        </div>
    </div>

    <div id="screen-tool" class="screen">
        <div id="tool-view-title" style="display:none;"></div>

        <div id="tool-form-container" style="width:100%;"></div>
    </div>

    <div class="tab-bar">
        <div class="tab-item active" data-target="screen-portal">
            <i class="fas fa-home"></i>홈
        </div>
        <div class="tab-item disabled" id="tab-tool" data-target="screen-tool">
            <i class="fas fa-wrench"></i>도구
        </div>
        <div class="tab-item" data-target="screen-setup">
            <i class="fas fa-cog"></i>설정
        </div>
    </div>

    <div id="toast">메시지</div>

    <script>
        let AppState = {
            url: localStorage.getItem('pmh_url') || window.location.origin,
            key: localStorage.getItem('pmh_key') || '',
            servers: [],      
            activeToolId: null,
            pollTimer: null
        };

        document.getElementById('inp-url').value = AppState.url;
        document.getElementById('inp-key').value = AppState.key;

        function showToast(msg, isError = false) {
            const t = document.getElementById('toast');
            t.innerHTML = msg;
            t.style.background = isError ? 'var(--danger)' : 'var(--success)';
            t.style.opacity = '1';
            setTimeout(() => t.style.opacity = '0', 3000);
        }

        function showScreen(id) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            
            document.querySelectorAll('.tab-item').forEach(t => {
                if (!t.classList.contains('disabled')) {
                    t.classList.toggle('active', t.dataset.target === id);
                }
            });

            AppState.activeScreen = id;
            if (id === 'screen-portal') startPortal();
            else stopPortal();

            if (AppState.pollTimer && id !== 'screen-tool') {
                clearTimeout(AppState.pollTimer);
                AppState.pollTimer = null;
            }
        }

        document.querySelectorAll('.tab-item').forEach(t => {
            t.addEventListener('click', () => {
                showScreen(t.dataset.target);
            });
        });

        async function generateSecureHeader(apiKey) {
            if (!apiKey) return "";
            
            const timestamp = Math.floor(Date.now() / 10000) * 10;
            const payload = `${apiKey}:${timestamp}`;
            const encoder = new TextEncoder();
            const data = encoder.encode(payload);
            const hashBuffer = await crypto.subtle.digest('SHA-256', data);
            const hashArray = Array.from(new Uint8Array(hashBuffer));
            const hashHex = hashArray.map(b => b.toString(16).padStart(2, '0')).join('');
            
            return `${timestamp}.${hashHex}`;
        }

        const PmhAPI = {
            call: async function(endpoint, method="GET", data=null, signal=null) {
                if(!AppState.url || !AppState.key) throw new Error("서버 정보가 설정되지 않았습니다.");
                
                const secureToken = await generateSecureHeader(AppState.key);
                
                const options = { 
                    method: method, 
                    headers: { "X-PMH-Signature": secureToken }
                };
                if (signal) options.signal = signal;
                if (data) { 
                    options.headers["Content-Type"] = "application/json"; 
                    options.body = JSON.stringify(data); 
                }
                
                try {
                    const res = await fetch(`${AppState.url}/api${endpoint}`, options);
                    
                    if (!res.ok) {
                        try {
                            const errJson = await res.json();
                            throw new Error(errJson.error || errJson.message || `HTTP ${res.status}`);
                        } catch(e) {
                            throw new Error(`서버 응답 오류 (HTTP ${res.status})`);
                        }
                    }

                    const contentType = res.headers.get("content-type");
                    if (contentType && contentType.includes("application/json")) {
                        return await res.json();
                    }
                    
                    return await res.text();
                    
                } catch(e) {
                    throw new Error(e.message || "네트워크 오류 또는 서버 응답 실패");
                }
            }
        };

        async function loadSharedCoreModules() {
            return new Promise((resolve, reject) => {
                let loadedCount = 0;
                const checkDone = () => { if (++loadedCount === 2) resolve(); };

                if (!document.getElementById('pmh-shared-css')) {
                    const link = document.createElement('link');
                    link.id = 'pmh-shared-css'; link.rel = 'stylesheet';
                    link.href = `${AppState.url}/api/client/pmh_ui_core.css?t=${Date.now()}`;
                    link.onload = checkDone; link.onerror = () => reject("UI Core CSS 로드 실패");
                    document.head.appendChild(link);
                } else { checkDone(); }

                if (!document.getElementById('pmh-shared-js')) {
                    const script = document.createElement('script');
                    script.id = 'pmh-shared-js';
                    script.src = `${AppState.url}/api/client/pmh_ui_core.js?t=${Date.now()}`;
                    script.onload = checkDone; script.onerror = () => reject("UI Core JS 로드 실패");
                    document.head.appendChild(script);
                } else { checkDone(); }
            });
        }

        async function connectServer(isTest = false) {
            const url = document.getElementById('inp-url').value.trim().replace(/\/$/, '');
            const key = document.getElementById('inp-key').value.trim();

            if (!url || !key) return showToast("URL과 접속 키를 입력하세요.", true);

            const btn = isTest ? document.getElementById('btn-test') : document.getElementById('btn-save');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';
            btn.disabled = true;

            try {
                AppState.url = url; AppState.key = key; 
                
                const conf = await PmhAPI.call('/client/config');
                
                if(isTest) {
                    showToast("마스터 서버 연결 테스트 성공!");
                } else {
                    localStorage.setItem('pmh_url', url);
                    localStorage.setItem('pmh_key', key);
                    
                    stopPortal();
                    AppState.servers = conf.SERVERS || [];
                    PortalState.nodes.clear(); PortalState.cards.clear(); PortalState.tools.clear();
                    PortalState.rendered = false;
                    document.getElementById('tool-list').replaceChildren();

                    await loadSharedCoreModules();
                    
                    showToast("설정 저장 및 연결 완료!");
                    showScreen('screen-portal');
                }
            } catch(e) {
                showToast("연결 실패: " + e.message, true);
            } finally {
                btn.innerHTML = origHtml;
                btn.disabled = false;
            }
        }

        document.getElementById('btn-test').addEventListener('click', () => connectServer(true));
        document.getElementById('btn-save').addEventListener('click', () => connectServer(false));

        const copyBtn = document.getElementById('btn-copy-key');
        if (copyBtn) {
            copyBtn.addEventListener('click', () => {
                const keyInput = document.getElementById('inp-key');
                if (!keyInput.value) {
                    showToast("복사할 API Key가 없습니다.", true);
                    return;
                }
                if (navigator.clipboard && window.isSecureContext) {
                    navigator.clipboard.writeText(keyInput.value).then(() => {
                        showToast("API Key가 복사되었습니다.");
                    }).catch(err => {
                        showToast("복사 실패. 브라우저 권한을 확인하세요.", true);
                    });
                } else {
                    keyInput.type = "text"; 
                    keyInput.select();
                    try {
                        document.execCommand("copy");
                        showToast("API Key가 복사되었습니다.");
                    } catch (err) {
                        showToast("복사 실패. 수동으로 복사해주세요.", true);
                    }
                    keyInput.type = "password"; 
                    window.getSelection().removeAllRanges();
                }
            });
        }

        const PortalState = { timer: null, inflight: null, generation: 0, active: false,
            pendingRefresh: false, rendered: false, nodes: new Map(), cards: new Map(), tools: new Map() };

        function portalVisible() {
            return AppState.activeScreen === 'screen-portal' && document.visibilityState === 'visible' && AppState.servers.length > 0;
        }

        function stopPortal() {
            PortalState.active = false;
            PortalState.generation++;
            PortalState.pendingRefresh = false;
            if (PortalState.timer !== null) clearInterval(PortalState.timer);
            PortalState.timer = null;
            PortalState.inflight?.controllers.forEach(controller => controller.abort());
        }

        function startPortal() {
            if (!portalVisible() || PortalState.active) return;
            PortalState.active = true;
            PortalState.timer = setInterval(() => loadPortal({ silent: true }), 10000);
            loadPortal({ silent: PortalState.rendered });
        }

        document.addEventListener('visibilitychange', () => portalVisible() ? startPortal() : stopPortal());
        window.addEventListener('pagehide', stopPortal);
        window.addEventListener('pageshow', event => { if (event.persisted) startPortal(); });

        function validatePortalResponse(data) {
            if (!data || data.error || data.status === 'error' || !Array.isArray(data.tools) || !Array.isArray(data.dashboard?.running) || !Array.isArray(data.dashboard?.cron) ||
                data.tools.some(tool => !tool || typeof tool.id !== 'string' || !tool.id ||
                    ['name', 'icon', 'description'].some(key => tool[key] != null && typeof tool[key] !== 'string') ||
                    (tool.version != null && !['string', 'number'].includes(typeof tool.version))) ||
                [...data.dashboard.running, ...data.dashboard.cron].some(job => !job || typeof job.tool_id !== 'string' || !job.tool_id ||
                    !['string', 'number'].includes(typeof job.server_id))) {
                throw new Error('Invalid node response');
            }
            return data;
        }

        async function readPortalNode(node, controller) {
            let timer;
            try {
                return validatePortalResponse(await Promise.race([
                    PmhAPI.call(`/relay/${encodeURIComponent(node.id)}/tools?t=${Date.now()}`, 'GET', null, controller.signal),
                    new Promise((_, reject) => { timer = setTimeout(() => {
                        controller.abort(); reject(new Error('Node timeout'));
                    }, 8000); })
                ]));
            } finally { clearTimeout(timer); }
        }

        function openPortalTool(toolId) {
            const tool = PortalState.tools.get(toolId);
            if (!tool) return;
            const running = [...new Set(tool.running.filter(job => !job.stale).map(job => job.serverIndex))];
            if (running.length === 1) return openTool(toolId, running[0]);
            if (running.length > 1) return showToast('여러 노드에서 실행 중입니다. 원하는 노드 배지를 선택하세요.');
            let saved = {};
            try { saved = JSON.parse(localStorage.getItem(`pmh_tool_cache_global_${toolId}`) || '{}'); } catch (error) {}
            const preferred = Number(saved.target_server_idx ?? 0);
            return openTool(toolId, tool.sources.includes(preferred) ? preferred : tool.sources[0]);
        }

        function renderPortal() {
            const tools = new Map(), running = new Map(), cron = new Map();
            let failed = 0;
            const nodeStatus = document.getElementById('portal-node-status');
            nodeStatus.replaceChildren();
            for (const [nodeId, snapshot] of PortalState.nodes) {
                const { node, data, stale, updated } = snapshot;
                if (stale) failed++;
                const status = document.createElement('span');
                status.className = stale ? 'badge badge-stale' : 'badge badge-node';
                status.textContent = `${node.name}: ${stale ? '연결 실패 · ' : ''}${updated ? '마지막 갱신 ' + new Date(updated).toLocaleTimeString() : '갱신 정보 없음'}`;
                nodeStatus.appendChild(status);
                if (!data) continue;
                for (const metadata of data.tools) {
                    if (!tools.has(metadata.id)) tools.set(metadata.id, { metadata, metadataStale: stale, sources: [], running: [], cron: [] });
                    else if (tools.get(metadata.id).metadataStale && !stale) {
                        tools.get(metadata.id).metadata = metadata;
                        tools.get(metadata.id).metadataStale = false;
                    }
                    tools.get(metadata.id).sources.push(node.index);
                }
                for (const kind of ['running', 'cron']) {
                    for (const job of data.dashboard[kind]) {
                        const key = JSON.stringify([nodeId, job.tool_id, String(job.server_id)]);
                        const list = kind === 'running' ? running : cron;
                        if (list.has(key)) continue;
                        const configuredIndex = AppState.servers.findIndex(server => server.id === nodeId &&
                            String(server.machine_id || server.machineIdentifier || 'default') === String(job.server_id));
                        const entry = { ...job, nodeId, nodeName: node.name,
                            serverIndex: configuredIndex >= 0 ? configuredIndex : node.index, stale };
                        list.set(key, entry);
                        tools.get(job.tool_id)?.[kind].push(entry);
                    }
                }
            }
            PortalState.tools = tools;
            for (const [kind, jobs] of [['run', running], ['cron', cron]]) {
                const count = [...jobs.values()].filter(job => !job.stale).length;
                const el = document.getElementById(`dash-${kind}-cnt`);
                el.innerText = failed === PortalState.nodes.size ? '확인 불가' : `${count}건${failed ? ' · 일부 미확인' : ''}`;
                el.style.color = count ? (kind === 'run' ? 'var(--primary)' : 'var(--success)') : '#777';
                document.getElementById(`dash-${kind}`).classList.toggle(kind === 'run' ? 'active-run' : 'active-cron', count > 0);
            }
            const list = document.getElementById('tool-list');
            list.querySelector('.portal-empty')?.remove();
            for (const [id, card] of PortalState.cards) {
                if (!tools.has(id)) { card.remove(); PortalState.cards.delete(id); }
            }
            const sorted = [...tools.values()].sort((a, b) => (a.metadata.name || a.metadata.id).toLowerCase().localeCompare((b.metadata.name || b.metadata.id).toLowerCase()));
            for (const tool of sorted) {
                const metadata = tool.metadata;
                let card = PortalState.cards.get(metadata.id);
                if (!card) {
                    card = document.createElement('div'); card.className = 'tool-card';
                    card.innerHTML = '<div class="tool-icon"><i></i></div><div class="tool-info"><div class="tool-title"><span class="portal-tool-name"></span><span class="portal-tool-version"></span><i class="portal-running fas fa-spinner fa-spin"></i></div><div class="tool-desc"></div><div class="portal-badges"></div></div><i class="fas fa-chevron-right" style="color:#555; font-size:16px;"></i>';
                    card.onclick = () => openPortalTool(metadata.id);
                    PortalState.cards.set(metadata.id, card);
                }
                const isRunning = tool.running.some(job => !job.stale);
                card.classList.toggle('running', isRunning);
                card.querySelector('.tool-icon i').className = metadata.icon || 'fas fa-wrench';
                card.querySelector('.portal-tool-name').textContent = metadata.name || metadata.id;
                card.querySelector('.portal-tool-version').textContent = `v${metadata.version || '1.0'}`;
                card.querySelector('.portal-running').style.display = isRunning ? '' : 'none';
                card.querySelector('.tool-desc').textContent = metadata.description || '';
                const badges = card.querySelector('.portal-badges'); badges.replaceChildren();
                for (const kind of ['running', 'cron']) {
                    const groups = new Map();
                    for (const job of tool[kind]) {
                        const key = job.serverIndex;
                        if (!groups.has(key)) groups.set(key, []);
                        groups.get(key).push(job);
                    }
                    for (const jobs of groups.values()) {
                        const job = jobs[0], button = document.createElement('button');
                        button.className = `badge ${job.stale ? 'badge-stale' : kind === 'running' ? 'badge-run' : 'badge-cron'}`;
                        button.textContent = `${job.nodeName} ${kind === 'running' ? '실행 중' : '크론'}${jobs.length > 1 ? ' ×' + jobs.length : ''}${job.stale ? ' · 마지막 상태' : ''}`;
                        button.onclick = event => { event.stopPropagation(); openTool(metadata.id, job.serverIndex); };
                        badges.appendChild(button);
                    }
                }
                card.title = new Set(tool.running.filter(job => !job.stale).map(job => job.serverIndex)).size > 1 ? '실행 중인 노드 배지를 선택하세요.' : '';
                // Keep existing cards in place on silent updates; only move when order changes.
                const position = sorted.indexOf(tool);
                if (list.children[position] !== card) list.insertBefore(card, list.children[position] || null);
            }
            if (!sorted.length) {
                const empty = document.createElement('div'); empty.className = 'portal-empty';
                empty.textContent = failed ? '툴 목록을 확인할 수 없습니다.' : '설치된 툴이 없습니다.';
                list.appendChild(empty);
            }
            PortalState.rendered = true;
            document.getElementById('portal-loading').style.display = 'none';
            document.getElementById('portal-content').style.display = 'block';
            document.getElementById('portal-error').style.display = 'none';
        }

        function loadPortal({ silent = false } = {}) {
            if (!PortalState.active || !portalVisible()) return Promise.resolve();
            if (PortalState.inflight) {
                if (PortalState.inflight.generation !== PortalState.generation) PortalState.pendingRefresh = true;
                return PortalState.inflight.promise;
            }
            if (!silent && !PortalState.rendered) {
                document.getElementById('portal-loading').style.display = 'block';
                document.getElementById('portal-content').style.display = 'none';
            }
            const nodes = [...new Map(AppState.servers.map((server, index) => [server.id || (index === 0 ? 'master_node' : `missing-${index}`),
                { id: server.id || (index === 0 ? 'master_node' : `missing-${index}`), name: server.name || server.id || 'MASTER', index }])).values()];
            const request = { generation: PortalState.generation, controllers: nodes.map(() => new AbortController()), promise: null };
            PortalState.inflight = request;
            document.getElementById('btn-portal-refresh').disabled = true;
            request.promise = (async () => {
                try {
                    const responses = await Promise.allSettled(nodes.map((node, index) => readPortalNode(node, request.controllers[index])));
                    if (request.generation !== PortalState.generation || !portalVisible()) return;
                    nodes.forEach((node, index) => {
                        const response = responses[index], previous = PortalState.nodes.get(node.id);
                        PortalState.nodes.set(node.id, response.status === 'fulfilled' ?
                            { node, data: response.value, stale: false, updated: Date.now() } :
                            { node, data: previous?.data, stale: true, updated: previous?.updated });
                    });
                    renderPortal();
                } finally {
                    if (PortalState.inflight === request) {
                        PortalState.inflight = null;
                        document.getElementById('btn-portal-refresh').disabled = false;
                        if (PortalState.pendingRefresh && PortalState.active && portalVisible()) {
                            PortalState.pendingRefresh = false;
                            loadPortal({ silent: PortalState.rendered });
                        }
                    }
                }
            })();
            return request.promise;
        }

        async function openTool(toolId, forceSrvIdx = null) {
            AppState.activeToolId = toolId;
            
            const tabTool = document.getElementById('tab-tool');
            tabTool.classList.remove('disabled');
            
            showScreen('screen-tool');
            document.getElementById('tool-view-title').innerText = "로딩 중...";
            
            const container = document.getElementById('tool-form-container');
            container.innerHTML = '<div style="text-align:center; padding:30px;"><i class="fas fa-spinner fa-spin fa-2x" style="color:var(--primary);"></i></div>';

            const globalCacheStr = localStorage.getItem(`pmh_tool_cache_global_${toolId}`) || "{}";
            let globalCache = {}; try { globalCache = JSON.parse(globalCacheStr); } catch(e) {}
            
            let srvIdx = (forceSrvIdx !== null && forceSrvIdx !== undefined) ? Number(forceSrvIdx) : (globalCache['target_server_idx'] || 0);
            if (srvIdx >= AppState.servers.length) srvIdx = 0;
            
            globalCache['target_server_idx'] = srvIdx; 
            localStorage.setItem(`pmh_tool_cache_global_${toolId}`, JSON.stringify(globalCache));

            const activeServerNode = AppState.servers[srvIdx] || {};
            const activeServerId = activeServerNode.id || 'master_node';
            const activeMachineId = activeServerNode.machine_id || 'default';
            
            try {
                if (typeof PmhUICore === 'undefined') throw new Error("UI 코어 모듈이 로드되지 않았습니다.");

                const uiSchema = await PmhAPI.call(`/relay/${activeServerId}/tool/${toolId}/ui?server_id=${activeMachineId}`);
                const toolIconHtml = uiSchema.icon ? `<i class="${uiSchema.icon}" style="margin-right: 6px;"></i>` : '<i class="fas fa-wrench" style="margin-right: 6px;"></i>';
                document.getElementById('tool-view-title').innerHTML = `${toolIconHtml}${uiSchema.title || toolId}`;

                PmhUICore.createToolInstance({
                    container: container,
                    toolId: toolId,
                    uiSchema: uiSchema,
                    servers: AppState.servers,
                    activeServerIdx: srvIdx,
                    
                    apiAdapter: {
                        run: async (data) => await PmhAPI.call(`/relay/${activeServerId}/tool/${toolId}/run`, "POST", data),
                        status: async (taskId) => await PmhAPI.call(`/relay/${activeServerId}/tool/${toolId}/status?task_id=${taskId}&server_id=${activeMachineId}`, "GET"),
                        cancel: async (taskId) => await PmhAPI.call(`/relay/${activeServerId}/tool/${toolId}/cancel`, "POST", {task_id: taskId, _server_id: activeMachineId}),
                        getSignature: async () => await generateSecureHeader(AppState.key)
                    },
                    toast: { success: (m)=>showToast(m), error: (m)=>showToast(m, true), info: (m)=>showToast(m) }
                });

                setTimeout(() => {
                    const toolIconHtml = uiSchema.icon ? `<i class="${uiSchema.icon}" style="margin-right: 6px;"></i>` : '<i class="fas fa-wrench" style="margin-right: 6px;"></i>';
                    
                    const navTitleEl = document.getElementById('tool-view-title');
                    if (navTitleEl) navTitleEl.innerHTML = `${toolIconHtml}${uiSchema.title || toolId}`;
                    
                    const panelTitleTextEl = document.getElementById('pmh-panel-title-text');
                    if (panelTitleTextEl) {
                        panelTitleTextEl.innerText = uiSchema.title || toolId;
                        const iconI = panelTitleTextEl.previousElementSibling;
                        if (iconI && iconI.tagName === 'I') {
                            iconI.className = uiSchema.icon || 'fas fa-wrench';
                        }
                    }

                    const srvSelectEl = document.getElementById('pmh_srv_select');
                    if (srvSelectEl) {
                        srvSelectEl.addEventListener('change', (e) => {
                            const newIdx = Number(e.target.value);
                            globalCache['target_server_idx'] = newIdx;
                            localStorage.setItem(`pmh_tool_cache_global_${toolId}`, JSON.stringify(globalCache));
                            openTool(toolId, newIdx);
                        });
                    }
                }, 100);

                const enforceDualPane = () => {
                    if (window.innerWidth > 768) {
                        const form = document.getElementById('pmh_tab_form');
                        const settings = document.getElementById('pmh_tab_settings');
                        const monitorTabBtn = document.querySelector('[data-tab="pmh_tab_monitor"]');
                        const formTabBtn = document.querySelector('[data-tab="pmh_tab_form"]');
                        
                        if (form && settings && form.style.display === 'none' && settings.style.display === 'none') {
                            form.style.display = 'flex';
                            if (monitorTabBtn) monitorTabBtn.classList.remove('active');
                            if (formTabBtn) formTabBtn.classList.add('active');
                        }
                    }
                };

                if (!window.dualPaneObserver) {
                    window.dualPaneObserver = new MutationObserver(enforceDualPane);
                }
                window.dualPaneObserver.disconnect();
                window.dualPaneObserver.observe(container, { attributes: true, subtree: true, attributeFilter: ['style'] });
                
                setTimeout(enforceDualPane, 150);

            } catch(e) { 
                showToast("툴을 불러오지 못했습니다. " + e.message, true); 
                showScreen('screen-portal'); 
            }
        }

        if (AppState.url && AppState.key) connectServer(false);
        else showScreen('screen-setup');

        let deferredPrompt;
        const installBanner = document.getElementById('pwa-install-banner');
        const installBtn = document.getElementById('btn-pwa-install');

        const isStandalone = window.matchMedia('(display-mode: standalone)').matches 
                             || window.navigator.standalone 
                             || document.referrer.includes('android-app://');

        if (!isStandalone) {
            window.addEventListener('beforeinstallprompt', (e) => {
                e.preventDefault();
                deferredPrompt = e;
                installBanner.style.display = 'flex';
            });

            const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) && !window.MSStream;
            if (isIOS) {
                installBanner.style.display = 'flex';
                installBanner.innerHTML = `<div style="display:flex; align-items:center; gap:10px;"><i class="fas fa-share-square" style="font-size:20px;"></i><span style="line-height:1.4;">Safari 하단의 '공유' 버튼을 누르고<br>'홈 화면에 추가'를 선택하세요.</span></div><button onclick="document.getElementById('pwa-install-banner').style.display='none'" style="background:transparent; border:none; color:#111; font-size:20px; cursor:pointer;"><i class="fas fa-times"></i></button>`;
            }
        }

        if (installBtn) {
            installBtn.addEventListener('click', async () => {
                if (deferredPrompt) {
                    installBanner.style.display = 'none';
                    deferredPrompt.prompt();
                    const { outcome } = await deferredPrompt.userChoice;
                    deferredPrompt = null;
                }
            });
        }
    </script>
</body>
